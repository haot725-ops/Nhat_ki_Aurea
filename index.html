<style>
/* Giao diện theo Aurea: giấy kem, xanh thông, đồng thau. Sáng là mặc định, có nút chuyển tối. */
:root{
  --bg:#f4efe6; --surface:#fbf8f2; --surface-2:#efe8db; --line:#e0d6c6; --line-2:#cdbfa8;
  --fg:#14221e; --fg-2:#3c4a44; --fg-3:#6e675e;
  --gold:#7a5528; --gold-mark:#9a6e34; --gold-2:#e4c48a; --gold-soft:rgba(122,85,40,.11);
  --btn-a:#1c4a3d; --btn-b:#14352c; --gold-ink:#f7f3eb;
  --profit:#176b42; --profit-soft:#e5f3eb; --loss:#9b3a32; --loss-soft:#f8e8e6; --on-pl:#fff;
  --hero-a:#1c4a3d; --hero-b:#14352c; --hero-fg:#f7f3eb; --hero-fg-2:#d5e0da;
  --shadow:0 0 0 1px rgb(20 34 30/.06),0 1px 2px -1px rgb(20 34 30/.05),0 14px 30px -18px rgb(20 34 30/.35);
  --lift:0 0 0 1px rgb(20 34 30/.08),0 18px 40px -18px rgb(20 34 30/.4);
  --r:1.25rem; --ease:cubic-bezier(.2,0,0,1);
  --f-display:'Fraunces',ui-serif,Georgia,'Times New Roman',serif;
  --f-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Manrope',ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1a16; --surface:#15251f; --surface-2:#1b2f28; --line:#284238; --line-2:#35564a;
  --fg:#f1ece0; --fg-2:#bccbc3; --fg-3:#8fa49a;
  --gold:#e4c48a; --gold-mark:#e4c48a; --gold-2:#f3e6d0; --gold-soft:rgba(228,196,138,.13);
  --btn-a:#f0d9a8; --btn-b:#e4c48a; --gold-ink:#14221e;
  --profit:#6fd9a0; --profit-soft:rgba(111,217,160,.13); --loss:#f09a90; --loss-soft:rgba(240,154,144,.14); --on-pl:#0b1a14;
  --hero-a:#1c4a3d; --hero-b:#0f2a22;
  --shadow:0 0 0 1px rgb(255 255 255/.04),0 14px 30px -18px rgb(0 0 0/.7);
  --lift:0 0 0 1px rgb(255 255 255/.07),0 18px 40px -18px rgb(0 0 0/.75);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--bg);overscroll-behavior-y:none}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.5;color:var(--fg);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 120px;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:background .3s,color .3s;
}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold-mark);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:600}
p{margin:0;text-wrap:pretty}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--profit)} .dn{color:var(--loss)} .gd{color:var(--gold)}
.wrap{max-width:1080px;margin:0 auto}

/* Đầu trang */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--gold-2);background:linear-gradient(140deg,#1c4a3d,#14352c);box-shadow:var(--shadow)}
.brand h1{font-size:23px;font-weight:600;line-height:1.1}
.brand p{color:var(--fg-3);font-size:13px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:8px;flex:none}
.theme-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,color .2s}
.theme-btn:active{transform:scale(.92)}
.theme-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .moon{display:none} :root[data-theme="dark"] .theme-btn .sun{display:none} :root[data-theme="dark"] .theme-btn .moon{display:block}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--fg-2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold-mark);flex:none}
.chip.ok::before{background:var(--profit)} .chip.warn::before{background:var(--loss)}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--gold-mark);background:var(--gold-soft);border-radius:14px;padding:11px 14px;margin-bottom:14px;color:var(--fg-2);font-size:13.5px}
.banner b{color:var(--gold)}
main{transition:opacity .3s;overflow-x:clip}
html{overflow-x:clip}
main.loading{opacity:.55;pointer-events:none}

/* Thẻ và lưới */
.view{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0;transition:background .3s}
.card h2{font-size:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);font-weight:700}
.muted{color:var(--fg-3);font-size:13px}
@media (min-width:860px){.view{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.span2{grid-column:1/-1}}

/* Hiệu ứng */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes arcin{from{stroke-dasharray:0 var(--c)}}
@keyframes fade{from{opacity:0}}
@keyframes sheen{0%{transform:translateX(-130%)}60%,100%{transform:translateX(260%)}}
@keyframes tin-n{from{opacity:0;transform:translate3d(28px,0,0)}to{opacity:1;transform:none}}
@keyframes tin-p{from{opacity:0;transform:translate3d(-28px,0,0)}to{opacity:1;transform:none}}
.view.tin-n{animation:tin-n 240ms var(--ease) both}
.view.tin-p{animation:tin-p 240ms var(--ease) both}
.play .rv{animation:rise .52s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}

/* Thẻ số dư */
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 20px 14px;color:var(--hero-fg);
  background:radial-gradient(520px 220px at 100% 0%,rgba(228,196,138,.20),transparent 70%),linear-gradient(150deg,var(--hero-a),var(--hero-b));box-shadow:var(--lift)}
.hero::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,252,246,.10),transparent);animation:sheen 7s ease-in-out infinite;pointer-events:none}
.hero .eyebrow{color:var(--hero-fg-2)}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.usdt{font-size:11px;letter-spacing:.1em;color:#14221e;background:linear-gradient(140deg,#f3e6d0,#e4c48a);padding:3px 9px;border-radius:999px;font-weight:800}
.bal{font-family:var(--f-display);font-weight:600;font-size:clamp(38px,10vw,56px);line-height:1.05;margin:8px 0 6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fbf3dc}
.hero-sub{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--hero-fg-2)}
.hero-sub b{color:var(--hero-fg);font-weight:700}
.hero .up{color:#b7ebc9} .hero .dn{color:#f3c1bb}
.spark{margin:10px -6px 0;height:58px}

/* Mục tiêu ngày */
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:420px){.goal{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:132px;height:132px}
.ring svg{display:block}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .mid b{font-family:var(--f-display);font-size:26px;font-weight:600}
.ring .mid small{display:block;color:var(--fg-3);font-size:11px;margin-top:2px}
.trk{fill:none;stroke:var(--surface-2);stroke-width:12}
.prog{fill:none;stroke-width:12;stroke-linecap:round}
.play .prog{animation:arcin 1.1s var(--ease) .2s both}
.goal-line{font-family:var(--f-display);font-size:28px;font-weight:600;margin:2px 0 8px}
.goal-line small{font-family:var(--f-body);font-size:13px;color:var(--fg-3);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;background:var(--gold-soft);color:var(--gold)}
.pill.up{background:var(--profit-soft);color:var(--profit)} .pill.dn{background:var(--loss-soft);color:var(--loss)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;text-align:left}

/* Ô nhập */
label.f{display:grid;gap:5px;font-size:12px;color:var(--fg-3);font-weight:600;min-width:0}
.in,select.in,textarea.in{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:.75rem;padding:11px 12px;color:var(--fg);font-size:16px;transition:border-color .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--gold-mark);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.in{resize:vertical;min-height:84px;line-height:1.45}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.unit{position:relative}
.unit .in{padding-right:56px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--fg-3);pointer-events:none;font-weight:600}
.search-bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.search-bar .in{flex:1;min-width:160px}

/* Chỉ số nhỏ */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--fg-3);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--fg-3);margin-top:1px}

/* Kỷ luật */
.rules{display:grid;gap:8px}
.rule{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:.9rem;background:var(--surface-2);border:1px solid transparent;width:100%;transition:border-color .2s,background .2s,transform .15s}
.rule:active{transform:scale(.97)}
.rule .bx{width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:.2s;color:var(--gold-ink)}
.rule .bx svg{opacity:0;transform:scale(.6);transition:.2s}
.rule.on{border-color:var(--gold-mark);background:var(--gold-soft)}
.rule.on .bx{background:linear-gradient(140deg,var(--btn-a),var(--btn-b));border-color:transparent}
.rule.on .bx svg{opacity:1;transform:none}
.rule span.t{font-size:14px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cb{background:var(--surface-2);color:var(--fg-2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;border:1px solid transparent;transition:background .2s,color .2s,transform .15s}
.cb:active{transform:scale(.95)}
.cb.on{background:linear-gradient(140deg,var(--btn-a),var(--btn-b));color:var(--gold-ink)}

/* Danh sách lệnh (đã sửa tràn: cột lưới minmax(0,1fr) và min-width:0) */
.tlist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.trade{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-width:0;max-width:100%;padding:12px 14px;border-radius:1rem;background:var(--surface-2);transition:transform .2s,box-shadow .2s}
.trade:active{transform:scale(.97)}
@media (hover:hover){.trade:hover{transform:translateY(-2px);box-shadow:var(--lift)}}
.trade.demo{cursor:default}
@media (hover:hover){.trade.demo:hover{transform:none;box-shadow:none}}
.t-l,.t-r{display:flex;align-items:center;gap:12px;min-width:0}
.t-l{flex:1 1 auto}
.t-r{text-align:right;flex-direction:column;align-items:flex-end;gap:2px;flex:none;max-width:44%}
.coin{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--gold-2);background:linear-gradient(140deg,#1c4a3d,#14352c)}
.t-l b{display:block;font-size:15px;font-weight:700}
.t-l small,.t-r small{color:var(--fg-3);font-size:12px}
.t-l div{min-width:0}
.t-l small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-r .pnl{font-family:var(--f-display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.t-r small{white-space:nowrap}
.side{font-size:10px;letter-spacing:.08em;padding:2px 7px;border-radius:6px;font-weight:800;margin-right:6px;vertical-align:1px}
.side.long{background:var(--profit-soft);color:var(--profit)} .side.short{background:var(--loss-soft);color:var(--loss)}
.empty{text-align:center;padding:26px 12px;color:var(--fg-3)}
.empty b{display:block;font-family:var(--f-display);font-size:18px;color:var(--fg);margin-bottom:4px;font-weight:600}

/* Nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:.9rem;padding:12px 20px;font-weight:700;font-size:15px;transition:transform .15s,box-shadow .2s,filter .2s}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.gold{background:linear-gradient(140deg,var(--btn-a),var(--btn-b));color:var(--gold-ink);box-shadow:var(--shadow)}
.btn.gold:active{transform:scale(.96)}
@media (hover:hover){.btn.gold:hover{filter:brightness(1.1)}}
.btn.ghost{color:var(--fg-2);background:var(--surface-2)}
.btn.ghost:active{transform:scale(.96)}
.btn.danger{border:1px solid var(--loss);color:var(--loss)}
.btn.danger.arm{background:var(--loss);color:var(--on-pl)}

/* Biểu đồ */
.chart{position:relative;width:100%;min-height:60px;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart text,.ax{font-family:var(--f-mono);font-size:10.5px;fill:var(--fg-3)}
.grid{stroke:var(--line);stroke-width:1}
.zero{stroke:var(--line-2);stroke-width:1.2}
.b-up{fill:var(--profit)} .b-dn{fill:var(--loss)}
.bar{transform-box:fill-box}
.bar.u{transform-origin:50% 100%} .bar.d{transform-origin:50% 0}
.play .bar{animation:grow .8s var(--ease) both;animation-delay:calc(var(--k,0)*28ms + .15s)}
.hit{fill:transparent}
@media (hover:hover){.hit:hover{fill:var(--gold-soft)}}
.ln{fill:none;stroke:var(--gold-mark);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.play .ln{stroke-dasharray:1;animation:draw 1.3s cubic-bezier(.3,.7,.2,1) .15s both}
.play .ar{animation:fade 1.2s .5s both}
.dot{fill:var(--gold-mark);stroke:var(--surface);stroke-width:2.5}
.xh{stroke:var(--gold-mark);stroke-width:1;stroke-dasharray:3 3}
.arc{fill:none;stroke-width:20;transition:opacity .2s}
.play .arc{animation:arcin 1s var(--ease) .2s both}
.donut{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:460px){.donut{grid-template-columns:1fr;justify-items:center}}
.dwrap{position:relative;width:160px;height:160px}
.dwrap .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;line-height:1.1}
.dwrap .mid b{font-family:var(--f-display);font-size:30px;font-weight:600}
.dwrap .mid small{display:block;font-size:11px;color:var(--fg-3);margin-top:3px}
.legend{display:grid;gap:9px;width:100%;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:9px;justify-content:space-between}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:-1px}
.legend span.n{font-weight:700;font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:78px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px;margin-bottom:11px}
.prow .nm{font-size:12px;font-weight:700;color:var(--fg-2);white-space:nowrap}
.prow .tk{position:relative;height:12px;background:var(--surface-2);border-radius:6px}
.prow .tk i{position:absolute;top:0;bottom:0;border-radius:6px;transform-origin:var(--o,0) 50%}
.play .prow .tk i{animation:growx .8s var(--ease) .2s both}
.prow .tk::after{content:"";position:absolute;top:-2px;bottom:-2px;left:var(--z);width:1.5px;background:var(--line-2)}
.prow b{text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.range{display:flex;gap:6px;flex-wrap:wrap}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border-radius:12px;padding:8px 11px;font-size:12.5px;box-shadow:var(--lift);max-width:220px;line-height:1.4}
.tip b{font-weight:700}
.tip .d{color:var(--fg-3);font-size:11.5px;display:block}

/* Nhật ký theo ngày */
.jl{display:contents}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dayhead h3{font-size:17px;text-transform:capitalize}
.dayhead .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{margin-top:12px;padding:10px 12px;border-left:3px solid var(--gold-mark);background:var(--gold-soft);border-radius:0 10px 10px 0;color:var(--fg-2);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Cài đặt */
.sgrid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.sgrid{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--fg-3);margin-top:4px;font-weight:500}

/* Thanh điều hướng */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;
  width:min(500px,calc(100% - 32px));display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;gap:2px;
  padding:8px;border-radius:24px;background:var(--surface);box-shadow:var(--lift);transition:background .3s}
.dock .tab{display:grid;justify-items:center;gap:3px;padding:7px 2px;border-radius:16px;color:var(--fg-3);font-size:11px;font-weight:700;transition:color .2s,background .2s,transform .15s}

<script>

function calcPnl(side,lev,margin,entry,exit,fee){
  if(!(entry>0)||!(exit>0)||!(margin>0)||!(lev>0)) return null;
  var dir=side==='short'?-1:1;
  return margin*lev*((exit-entry)/entry)*dir-(fee||0);
}

function makeDemo(){
  var base={'BTC/USDT':68000,'ETH/USDT':3400,'SOL/USDT':165,'BNB/USDT':590,'XRP/USDT':0.58};
  var pairs=Object.keys(base), levs=[10,15,20,25], setups=['Breakout','Pullback','Theo xu hướng','Đảo chiều'];
  var seed=11; function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
  var out=[], now=new Date();
  for(var i=13;i>=0;i--){
    var d=new Date(now); d.setDate(d.getDate()-i);
    var cnt=i===0?2:1+Math.floor(rnd()*3);

      var pair=pairs[Math.floor(rnd()*pairs.length)], side=rnd()>.42?'long':'short';
      var lev=levs[Math.floor(rnd()*levs.length)], margin=Math.round(60+rnd()*140);
      var entry=base[pair]*(1+(rnd()-.5)*.02), fav=(rnd()-.36)*.02;

function tradeRow(t,demo){
  var base=String(t.pair||'').split('/')[0].slice(0,4);
  var roi=t.margin>0?(t.pnl/t.margin*100):0;
  return '<button class="trade'+(demo?' demo':'')+'" data-act="trade" data-id="'+esc(t.id)+'" aria-label="Sửa lệnh '+esc(t.pair)+'">'+
    '<div class="t-l"><span class="coin">'+esc(base)+'</span><div><b>'+esc(t.pair)+'</b><small><span class="side '+(t.side==='short'?'short':'long')+'">'+(t.side==='short'?'SHORT':'LONG')+'</span>'+esc(t.time||'')+' · '+nf(t.lev,0)+'x · vốn '+nf(t.margin,0)+(t.setup?' · '+esc(t.setup):'')+'</small></div></div>'+
    '<div class="t-r"><span class="pnl '+tone(t.pnl)+'">'+sg(t.pnl)+'</span><small class="'+tone(roi)+'">'+(roi>0?'▲ ':roi<0?'▼ ':'')+sg(roi,1)+'% ROI</small></div></button>';

function kpi(l,v,s,t){ return '<div class="kpi"><div class="l">'+l+'</div><div class="v num '+(t||'')+'">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }
function countTo(el,val,fmt){
  var from=+el.dataset.v; if(isNaN(from)) from=0;
  if(from===val&&el.textContent){ return; }
  el.dataset.v=val;
  if(REDUCED||!isFinite(from)){ el.textContent=fmt(val); return; }
  var t0=performance.now(), dur=900;
  (function step(now){ var p=clamp((now-t0)/dur,0,1), e=1-Math.pow(1-p,3); el.textContent=fmt(from+(val-from)*e); if(p<1&&el.dataset.v==String(val)) requestAnimationFrame(step); else el.textContent=fmt(val); })(t0);
}

var tipEl=$('#tip');

  var l=clamp(x+14,8,window.innerWidth-w-8), t=y-h-14; if(t<8) t=y+18;
  tipEl.style.left=l+'px'; tipEl.style.top=t+'px';
}
function hideTip(){ tipEl.hidden=true; }
function nice(min,max,n,zero){
  if(zero!==false){ min=Math.min(min,0); max=Math.max(max,0); }
  if(max-min<1e-9){ max=min+1; }
  var raw=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), nm=raw/mag;
  var step=(nm<=1?1:nm<=2?2:nm<=2.5?2.5:nm<=5?5:10)*mag;
  var lo=Math.floor(min/step+1e-9)*step, hi=Math.ceil(max/step-1e-9)*step, ticks=[];
  for(var v=lo;v<=hi+step/2;v+=step) ticks.push(+v.toFixed(8));
  return {lo:lo,hi:hi,ticks:ticks};
}
function ab(v){ var a=Math.abs(v); return (v<0?'−':'')+(a>=10000?nf(a/1000,0)+'k':a>=1000?nf(a/1000,1)+'k':nf(a,a<10&&a%1?1:0)); }
function barPath(x,w,y0,y1,r){
  var up=y1<y0, h=Math.abs(y1-y0), rr=Math.min(r,h,w/2);
  if(h<1) return 'M'+x+','+(y0-1)+'h'+w+'v2h'+(-w)+'z';
  if(up) return 'M'+x+','+y0+'V'+(y1+rr)+'Q'+x+','+y1+' '+(x+rr)+','+y1+'H'+(x+w-rr)+'Q'+(x+w)+','+y1+' '+(x+w)+','+(y1+rr)+'V'+y0+'Z';
  return 'M'+x+','+y0+'V'+(y1-rr)+'Q'+x+','+y1+' '+(x+rr)+','+y1+'H'+(x+w-rr)+'Q'+(x+w)+','+y1+' '+(x+w)+','+(y1-rr)+'V'+y0+'Z';
}

  document.addEventListener('touchstart',function(e){
    on=false; if(e.touches.length!==1||!$('#sheet').hidden) return;
    var t=e.target; if(!t||!t.closest) return;
    if(t.closest('input,textarea,select,.chart,.sheet-bg,[data-no-swipe]')) return;
    for(var n=t;n&&n!==document.body;n=n.parentElement){ var o=getComputedStyle(n).overflowX; if((o==='auto'||o==='scroll')&&n.scrollWidth>n.clientWidth+1) return; }
    var p=e.touches[0]; sx=p.clientX; sy=p.clientY; st=Date.now(); on=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!on) return; on=false;
    var p=e.changedTouches[0]; if(!p) return;
    var dx=p.clientX-sx, dy=p.clientY-sy, dt=Date.now()-st;
    if(Math.abs(dx)>=64&&Math.abs(dx)>=1.6*Math.abs(dy)&&dt<=700){
      var i=TABS.indexOf(cur)+(dx<0?1:-1); if(i>=0&&i<TABS.length) show(TABS[i]);
    }
  },{passive:true});
  document.addEventListener('touchcancel',function(){ on=false; },{passive:true});
})();

/* ---------- Giao diện sáng / tối ---------- */
$('#themeBtn').addEventListener('click',function(){
  var root=document.documentElement, dark=root.getAttribute('data-theme')==='dark';
  if(dark) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','dark');
  try{ localStorage.setItem('nhat-ky-trade.theme',dark?'light':'dark'); }catch(e){}
  var m=$('#metaTheme'); if(m) m.setAttribute('content',dark?'#f4efe6':'#0e1a16');
});

var h0=location.hash.replace('#',''); cur=TABS.indexOf(h0)>=0?h0:'hom-nay';
show(cur); boot();
})();
</script>
